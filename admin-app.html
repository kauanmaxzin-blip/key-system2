<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauan Xit - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#7364ff',
                        bgDark: '#111113',
                        cardDark: '#1c1c1e'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111113; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .tab-btn.active { color: #7364ff; border-bottom: 2px solid #7364ff; }
        .glass { background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(10px); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111113; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Notificações Toast -->
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-bgDark z-40">
        <div class="glass p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-800 m-4">
            <div class="text-center mb-8">
                <i class="fa-solid fa-key text-4xl text-accent mb-4"></i>
                <h1 class="text-2xl font-bold">Painel Admin</h1>
                <p class="text-gray-400 text-sm mt-2">Kauan Xit Key Server</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
                <div class="mb-6">
                    <label class="block text-gray-400 text-sm font-bold mb-2" for="password">Senha do Admin</label>
                    <input class="shadow appearance-none border border-gray-700 rounded w-full py-3 px-4 bg-gray-900 text-white leading-tight focus:outline-none focus:border-accent" id="password" type="password" placeholder="Introduzir senha..." required>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-accent hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded transition duration-200 flex justify-center items-center">
                    <span>Entrar no Painel</span>
                </button>
                <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL (Oculta por defeito) -->
    <div id="app" class="hidden flex-1 flex flex-col max-w-4xl w-full mx-auto p-4 sm:p-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center py-4 border-b border-gray-800 mb-6">
            <div class="flex items-center gap-3">
                <div class="bg-accent text-white p-2 rounded-lg">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-xl font-bold">Kauan Xit</h1>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-red-500 transition">
                <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Sair
            </button>
        </header>

        <!-- Tabs -->
        <div class="flex border-b border-gray-800 mb-6">
            <button onclick="switchTab('gerar')" id="tab-gerar" class="tab-btn active flex-1 py-3 text-center font-semibold text-gray-400 transition hover:text-white">
                <i class="fa-solid fa-plus mr-2"></i> Gerar Keys
            </button>
            <button onclick="switchTab('gerir')" id="tab-gerir" class="tab-btn flex-1 py-3 text-center font-semibold text-gray-400 transition hover:text-white">
                <i class="fa-solid fa-list mr-2"></i> Gerir Keys
            </button>
        </div>

        <!-- ABA: GERAR KEYS -->
        <div id="view-gerar" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Controlos -->
                <div class="cardDark p-6 rounded-xl border border-gray-800">
                    <h2 class="text-lg font-bold mb-4 flex items-center"><i class="fa-regular fa-clock text-accent mr-2"></i> Configuração da Key</h2>
                    
                    <div class="mb-4">
                        <label class="block text-gray-400 text-sm font-bold mb-2">Validade (Dias)</label>
                        <select id="gen-days" class="w-full bg-gray-900 border border-gray-700 text-white rounded py-2 px-3 focus:outline-none focus:border-accent">
                            <option value="1">1 Dia</option>
                            <option value="3">3 Dias</option>
                            <option value="7" selected>7 Dias</option>
                            <option value="15">15 Dias</option>
                            <option value="30">30 Dias</option>
                            <option value="999">Vitalício (999 dias)</option>
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-400 text-sm font-bold mb-2">Quantidade a Gerar</label>
                        <input type="number" id="gen-qty" min="1" max="100" value="1" class="w-full bg-gray-900 border border-gray-700 text-white rounded py-2 px-3 focus:outline-none focus:border-accent">
                    </div>

                    <button onclick="generateKeys()" id="btn-generate" class="w-full bg-accent hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded transition duration-200">
                        <i class="fa-solid fa-key mr-2"></i> Gerar Agora
                    </button>
                </div>

                <!-- Resultados -->
                <div class="cardDark p-6 rounded-xl border border-gray-800 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold flex items-center"><i class="fa-solid fa-check text-green-500 mr-2"></i> Keys Geradas</h2>
                        <button onclick="copyKeys()" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded transition text-gray-300">
                            <i class="fa-regular fa-copy"></i> Copiar Tudo
                        </button>
                    </div>
                    <textarea id="gen-output" readonly class="flex-1 w-full bg-gray-900 border border-gray-700 text-accent font-mono rounded p-3 focus:outline-none resize-none min-h-[150px]" placeholder="As tuas keys vão aparecer aqui..."></textarea>
                </div>
            </div>
        </div>

        <!-- ABA: GERIR KEYS -->
        <div id="view-gerir" class="hidden flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Base de Dados <span id="key-count" class="text-gray-500 text-sm font-normal ml-2">(0 keys)</span></h2>
                <button onclick="loadKeys()" id="btn-refresh" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded transition text-sm">
                    <i class="fa-solid fa-arrows-rotate mr-2"></i> Atualizar
                </button>
            </div>

            <!-- Lista -->
            <div class="cardDark rounded-xl border border-gray-800 overflow-hidden flex-1">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-900 border-b border-gray-800 text-gray-400 text-sm">
                                <th class="p-4 font-semibold">Key</th>
                                <th class="p-4 font-semibold">Status</th>
                                <th class="p-4 font-semibold">Validade</th>
                                <th class="p-4 font-semibold">User ID</th>
                                <th class="p-4 font-semibold text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="keys-tbody" class="text-sm divide-y divide-gray-800">
                            <!-- Inserido via JS -->
                            <tr><td colspan="5" class="p-6 text-center text-gray-500">A carregar dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminPass = "";

        // --- SISTEMA DE TOAST (NOTIFICAÇÕES) ---
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded shadow-lg transition-opacity duration-300 z-50 ${isError ? 'bg-red-600' : 'bg-green-600'}`;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        // --- API FETCHER ---
        async function apiRequest(endpoint, body) {
            try {
                // Como o site está no mesmo servidor, usamos caminhos relativos
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                return await res.json();
            } catch (err) {
                return { success: false, error: "Erro de conexão com a API." };
            }
        }

        // --- LOGIN ---
        async function doLogin() {
            const passInput = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errTxt = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;
            errTxt.classList.add('hidden');

            // Testa a password fazendo um pedido de listagem
            const data = await apiRequest('/list', { password: passInput });
            
            btn.innerHTML = 'Entrar no Painel';
            btn.disabled = false;

            if (data && data.success) {
                adminPass = passInput;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('flex');
            } else {
                errTxt.innerText = data.error || "Senha incorreta!";
                errTxt.classList.remove('hidden');
            }
        }

        function logout() {
            adminPass = "";
            document.getElementById('password').value = "";
            document.getElementById('app').classList.add('hidden');
            document.getElementById('app').classList.remove('flex');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // --- TABS ---
        function switchTab(tab) {
            document.getElementById('tab-gerar').classList.remove('active');
            document.getElementById('tab-gerir').classList.remove('active');
            document.getElementById('view-gerar').classList.add('hidden');
            document.getElementById('view-gerir').classList.add('hidden');

            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`view-${tab}`).classList.remove('hidden');

            if (tab === 'gerir') {
                document.getElementById(`view-${tab}`).classList.add('flex');
                loadKeys();
            } else {
                document.getElementById('view-gerir').classList.remove('flex');
            }
        }

        // --- GERAR KEYS ---
        async function generateKeys() {
            const days = document.getElementById('gen-days').value;
            const qty = document.getElementById('gen-qty').value;
            const btn = document.getElementById('btn-generate');
            const out = document.getElementById('gen-output');

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> A Gerar...';
            btn.disabled = true;

            const data = await apiRequest('/generate', { password: adminPass, days: days, quantity: qty });

            btn.innerHTML = '<i class="fa-solid fa-key mr-2"></i> Gerar Agora';
            btn.disabled = false;

            if (data.success) {
                out.value = data.keys.join('\n');
                showToast(`${data.keys.length} Key(s) gerada(s) com sucesso!`);
            } else {
                showToast(data.error || "Erro ao gerar keys.", true);
            }
        }

        function copyKeys() {
            const out = document.getElementById('gen-output');
            if (!out.value) return;
            out.select();
            document.execCommand('copy');
            showToast("Keys copiadas para a área de transferência!");
        }

        // --- GERIR KEYS ---
        async function loadKeys() {
            const tbody = document.getElementById('keys-tbody');
            const btn = document.getElementById('btn-refresh');
            const countLbl = document.getElementById('key-count');

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Atualizar';
            tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-500">A carregar...</td></tr>';

            const data = await apiRequest('/list', { password: adminPass });
            btn.innerHTML = '<i class="fa-solid fa-arrows-rotate mr-2"></i> Atualizar';

            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500">Erro: ${data.error}</td></tr>`;
                return;
            }

            countLbl.innerText = `(${data.total} keys)`;

            if (data.keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-500">Nenhuma key encontrada no servidor.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            
            // Reverter ordem para mostrar as mais recentes primeiro
            const sortedKeys = data.keys.reverse();

            sortedKeys.forEach(k => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 transition border-b border-gray-800 last:border-0";
                
                let statusBadge = '';
                if(k.status === 'ativa') statusBadge = '<span class="px-2 py-1 bg-green-500/20 text-green-400 rounded-full text-xs font-bold">ATIVA</span>';
                else if(k.status === 'expirada') statusBadge = '<span class="px-2 py-1 bg-red-500/20 text-red-400 rounded-full text-xs font-bold">EXPIRADA</span>';
                else statusBadge = '<span class="px-2 py-1 bg-yellow-500/20 text-yellow-400 rounded-full text-xs font-bold">AGUARDANDO</span>';

                tr.innerHTML = `
                    <td class="p-4 font-mono text-gray-300">${k.key}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-gray-400">${k.days} Dias <br><span class="text-xs text-gray-500">${k.expiresAt || '-'}</span></td>
                    <td class="p-4 font-mono text-xs text-gray-400">${k.userId || '-'}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteKey('${k.key}')" class="text-red-500 hover:text-white hover:bg-red-600 border border-red-500/30 px-3 py-1 rounded transition text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteKey(keyStr) {
            if (!confirm(`Tens a certeza que queres apagar a key ${keyStr}?`)) return;

            const data = await apiRequest('/delete', { password: adminPass, key: keyStr });
            if (data.success) {
                showToast("Key apagada com sucesso!");
                loadKeys(); // Recarrega a lista
            } else {
                showToast(data.error || "Erro ao apagar key.", true);
            }
        }
    </script>
</body>
</html>
