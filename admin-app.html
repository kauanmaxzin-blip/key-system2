<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauan Xit | Premium Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        kxDark: '#0a0a0c',
                        kxCard: '#131316',
                        kxBorder: '#27272a',
                        kxAccent1: '#7364ff',
                        kxAccent2: '#9f54ff',
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'accent-grad': 'linear-gradient(135deg, #7364ff 0%, #9f54ff 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #0a0a0c; 
            color: #e4e4e7;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(115, 100, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(159, 84, 255, 0.08), transparent 25%);
            background-attachment: fixed;
        }
        
        /* Efeito Glassmorphism */
        .glass-card {
            background: rgba(19, 19, 22, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .input-kx {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #27272a;
            transition: all 0.3s ease;
        }
        .input-kx:focus {
            border-color: #7364ff;
            box-shadow: 0 0 0 3px rgba(115, 100, 255, 0.2);
            outline: none;
        }

        .btn-kx {
            background: linear-gradient(135deg, #7364ff, #9f54ff);
            box-shadow: 0 4px 15px rgba(115, 100, 255, 0.3);
            transition: all 0.3s ease;
        }
        .btn-kx:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(115, 100, 255, 0.5);
            filter: brightness(1.1);
        }
        .btn-kx:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn-kx:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        /* Tabs animadas */
        .tab-btn { position: relative; transition: color 0.3s ease; }
        .tab-btn.active { color: white; }
        .tab-indicator {
            position: absolute; bottom: -1px; left: 0; height: 2px; width: 100%;
            background: linear-gradient(90deg, #7364ff, #9f54ff);
            transform: scaleX(0); transition: transform 0.3s ease;
        }
        .tab-btn.active .tab-indicator { transform: scaleX(1); }

        /* Scrollbar fina */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-kxAccent1 selection:text-white antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl transition-all duration-300 transform translate-y-12 opacity-0 pointer-events-none z-50 flex items-center gap-3 backdrop-blur-md border border-white/10">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-msg" class="font-medium text-sm"></span>
    </div>

    <!-- Input Global para Formato da Key -->
    <input type="hidden" id="global-key-format" value="tradicional">

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-40 bg-kxDark/90 backdrop-blur-sm">
        <div class="glass-card p-10 rounded-2xl w-full max-w-[400px] m-4 relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-kxAccent1 to-transparent opacity-50"></div>
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-kxAccent1/20 to-kxAccent2/20 border border-kxAccent1/30 flex items-center justify-center mx-auto mb-5 shadow-[0_0_30px_rgba(115,100,255,0.2)]">
                    <i class="fa-solid fa-bolt text-2xl text-kxAccent1"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-wide">Kauan Xit</h1>
                <p class="text-zinc-500 text-sm mt-1">Admin Control Panel</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); doLogin();" class="space-y-5">
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-zinc-500"></i>
                        </div>
                        <input id="password" type="password" class="input-kx w-full rounded-xl py-3.5 pl-11 pr-4 text-white text-sm placeholder-zinc-600" placeholder="Insira a sua senha..." required>
                    </div>
                </div>
                <button type="submit" id="btn-login" class="btn-kx w-full text-white font-bold py-3.5 px-4 rounded-xl flex justify-center items-center gap-2">
                    <span>Autenticar</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
                <p id="login-error" class="text-red-400 text-xs text-center hidden bg-red-400/10 py-2 rounded-lg border border-red-400/20"></p>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app" class="hidden flex-1 flex-col max-w-5xl w-full mx-auto p-4 sm:p-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-transparent">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-kxAccent1/20 to-kxAccent2/20 border border-kxAccent1/30 flex items-center justify-center shadow-[0_0_20px_rgba(115,100,255,0.15)]">
                    <i class="fa-solid fa-bolt text-xl text-kxAccent1"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Kauan Xit</h1>
                    <p class="text-xs text-zinc-500">System v5.0 Online</p>
                </div>
            </div>
            <button onclick="logout()" class="flex items-center gap-2 text-zinc-400 hover:text-white bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition border border-white/5 text-sm font-medium">
                <i class="fa-solid fa-power-off"></i> Sair
            </button>
        </header>

        <!-- Navegação (Tabs) -->
        <div class="flex border-b border-kxBorder mb-8 gap-4 sm:gap-6 overflow-x-auto whitespace-nowrap scrollbar-hide pb-1">
            <button onclick="switchTab('gerar')" id="tab-gerar" class="tab-btn active pb-3 text-sm font-semibold text-zinc-400 hover:text-zinc-200 transition-all">
                <i class="fa-solid fa-bolt mr-2"></i> Rápido
                <div class="tab-indicator"></div>
            </button>
            <button onclick="switchTab('custom')" id="tab-custom" class="tab-btn pb-3 text-sm font-semibold text-zinc-400 hover:text-zinc-200 transition-all">
                <i class="fa-solid fa-stopwatch mr-2"></i> Personalizada
                <div class="tab-indicator"></div>
            </button>
            <button onclick="switchTab('gerir')" id="tab-gerir" class="tab-btn pb-3 text-sm font-semibold text-zinc-400 hover:text-zinc-200 transition-all">
                <i class="fa-solid fa-database mr-2"></i> Base de Dados
                <div class="tab-indicator"></div>
            </button>
        </div>

        <!-- ABA 1: GERADOR RÁPIDO (Botões) -->
        <div id="view-gerar" class="space-y-6 animate-[fadeIn_0.3s_ease]">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- Definicoes -->
                <div class="glass-card p-6 rounded-2xl lg:col-span-5 flex flex-col h-full">
                    <h2 class="text-white font-semibold mb-6 flex items-center gap-2 text-lg">
                        <i class="fa-solid fa-sliders text-kxAccent1"></i> Parâmetros
                    </h2>
                    
                    <div class="space-y-6 flex-1">
                        <!-- FORMATO DA KEY -->
                        <div>
                            <label class="block text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider">Formato da Key</label>
                            <div class="grid grid-cols-2 gap-2 sm:gap-3">
                                <button type="button" onclick="setKeyFormat('tradicional')" class="fmt-tradicional-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all">Tradicional</button>
                                <button type="button" onclick="setKeyFormat('zkxit')" class="fmt-zkxit-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">Zk Xit | 3.0</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider">Tempo de Validade</label>
                            <div class="grid grid-cols-3 gap-2 sm:gap-3">
                                <button type="button" onclick="selectDay(1)" id="btn-day-1" class="day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">1 Dia</button>
                                <button type="button" onclick="selectDay(3)" id="btn-day-3" class="day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">3 Dias</button>
                                <button type="button" onclick="selectDay(7)" id="btn-day-7" class="day-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all">7 Dias</button>
                                <button type="button" onclick="selectDay(15)" id="btn-day-15" class="day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">15 Dias</button>
                                <button type="button" onclick="selectDay(30)" id="btn-day-30" class="day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">30 Dias</button>
                                <button type="button" onclick="selectDay(999)" id="btn-day-999" class="day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">Vitalício</button>
                            </div>
                            <input type="hidden" id="gen-days" value="7">
                        </div>

                        <div>
                            <label class="block text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider">Quantidade</label>
                            <div class="relative flex items-center">
                                <button type="button" onclick="changeQty('gen-qty', -1)" class="absolute left-0 w-10 h-full flex items-center justify-center text-zinc-400 hover:text-white"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="number" id="gen-qty" min="1" max="100" value="1" class="input-kx w-full rounded-xl py-3 text-center text-white font-bold">
                                <button type="button" onclick="changeQty('gen-qty', 1)" class="absolute right-0 w-10 h-full flex items-center justify-center text-zinc-400 hover:text-white"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 mt-2 border-t border-white/5">
                        <button onclick="generateKeys('rapido')" id="btn-generate-rapido" class="btn-kx w-full text-white font-bold py-3.5 px-4 rounded-xl flex justify-center items-center gap-2">
                            <i class="fa-solid fa-key"></i> Gerar Keys
                        </button>
                    </div>
                </div>

                <!-- Resultado -->
                <div class="glass-card p-6 rounded-2xl lg:col-span-7 flex flex-col min-h-[300px]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-white font-semibold flex items-center gap-2 text-lg">
                            <i class="fa-solid fa-terminal text-kxAccent1"></i> Output
                        </h2>
                        <button onclick="copyKeys('gen-output')" class="text-xs bg-white/5 hover:bg-white/10 text-zinc-300 px-3 py-1.5 rounded-lg transition border border-white/5 flex items-center gap-2 font-medium">
                            <i class="fa-regular fa-copy"></i> Copiar Tudo
                        </button>
                    </div>
                    <div class="relative flex-1 rounded-xl overflow-hidden border border-kxBorder bg-[#050505]">
                        <textarea id="gen-output" readonly class="w-full h-full bg-transparent text-kxAccent1 font-mono text-sm p-4 focus:outline-none resize-none leading-relaxed" placeholder="Exemplo: ZkXit|3.0 - PLOIUKLOP90"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- ABA 2: KEY PERSONALIZADA -->
        <div id="view-custom" class="hidden space-y-6 animate-[fadeIn_0.3s_ease]">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div class="glass-card p-6 rounded-2xl lg:col-span-5 flex flex-col h-full">
                    <h2 class="text-white font-semibold mb-6 flex items-center gap-2 text-lg">
                        <i class="fa-solid fa-stopwatch text-kxAccent1"></i> Tempo Personalizado
                    </h2>
                    
                    <div class="space-y-6 flex-1">

                        <!-- FORMATO DA KEY -->
                        <div>
                            <label class="block text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider">Formato da Key</label>
                            <div class="grid grid-cols-2 gap-2 sm:gap-3">
                                <button type="button" onclick="setKeyFormat('tradicional')" class="fmt-tradicional-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all">Tradicional</button>
                                <button type="button" onclick="setKeyFormat('zkxit')" class="fmt-zkxit-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all">Zk Xit | 3.0</button>
                            </div>
                        </div>

                        <!-- Inputs de Tempo -->
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider text-center">Dias</label>
                                <input type="number" id="custom-dias" min="0" value="0" class="input-kx w-full rounded-xl py-3 text-center text-white font-bold" placeholder="0">
                            </div>
                            <div>
                                <label class="block text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider text-center">Horas</label>
                                <input type="number" id="custom-horas" min="0" max="23" value="1" class="input-kx w-full rounded-xl py-3 text-center text-white font-bold" placeholder="1">
                            </div>
                            <div>
                                <label class="block text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider text-center">Minutos</label>
                                <input type="number" id="custom-minutos" min="0" max="59" value="0" class="input-kx w-full rounded-xl py-3 text-center text-white font-bold" placeholder="0">
                            </div>
                        </div>

                        <div>
                            <label class="block text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider">Quantidade</label>
                            <div class="relative flex items-center">
                                <button type="button" onclick="changeQty('custom-qty', -1)" class="absolute left-0 w-10 h-full flex items-center justify-center text-zinc-400 hover:text-white"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="number" id="custom-qty" min="1" max="100" value="1" class="input-kx w-full rounded-xl py-3 text-center text-white font-bold">
                                <button type="button" onclick="changeQty('custom-qty', 1)" class="absolute right-0 w-10 h-full flex items-center justify-center text-zinc-400 hover:text-white"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 mt-2 border-t border-white/5">
                        <button onclick="generateKeys('custom')" id="btn-generate-custom" class="btn-kx w-full text-white font-bold py-3.5 px-4 rounded-xl flex justify-center items-center gap-2">
                            <i class="fa-solid fa-key"></i> Gerar Key Personalizada
                        </button>
                    </div>
                </div>

                <!-- Resultado -->
                <div class="glass-card p-6 rounded-2xl lg:col-span-7 flex flex-col min-h-[300px]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-white font-semibold flex items-center gap-2 text-lg">
                            <i class="fa-solid fa-terminal text-kxAccent1"></i> Output
                        </h2>
                        <button onclick="copyKeys('custom-output')" class="text-xs bg-white/5 hover:bg-white/10 text-zinc-300 px-3 py-1.5 rounded-lg transition border border-white/5 flex items-center gap-2 font-medium">
                            <i class="fa-regular fa-copy"></i> Copiar Tudo
                        </button>
                    </div>
                    <div class="relative flex-1 rounded-xl overflow-hidden border border-kxBorder bg-[#050505]">
                        <textarea id="custom-output" readonly class="w-full h-full bg-transparent text-kxAccent1 font-mono text-sm p-4 focus:outline-none resize-none leading-relaxed" placeholder="Exemplo: ZkXit|3.0 - PLOIUKLOP90"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- ABA 3: GERIR KEYS -->
        <div id="view-gerir" class="hidden flex-col flex-1 animate-[fadeIn_0.3s_ease]">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-white font-semibold text-lg flex items-center gap-2">
                        <i class="fa-solid fa-server text-kxAccent1"></i> Keys Ativas
                    </h2>
                    <p class="text-xs text-zinc-500 mt-1">Gere e monitore os acessos. <span id="key-count" class="text-kxAccent1 font-bold ml-1">0</span> keys totais.</p>
                </div>
                <button onclick="loadKeys()" id="btn-refresh" class="bg-white/5 hover:bg-white/10 text-white px-4 py-2 rounded-xl transition border border-white/5 text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> Atualizar
                </button>
            </div>

            <!-- Tabela -->
            <div class="glass-card rounded-2xl overflow-hidden flex-1 border border-white/5 shadow-xl flex flex-col">
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-black/40 border-b border-kxBorder text-zinc-400 text-xs uppercase tracking-wider">
                                <th class="px-6 py-4 font-semibold">Chave (Key)</th>
                                <th class="px-6 py-4 font-semibold">Estado</th>
                                <th class="px-6 py-4 font-semibold">Duração</th>
                                <th class="px-6 py-4 font-semibold">HWID / User</th>
                                <th class="px-6 py-4 font-semibold text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="keys-tbody" class="text-sm divide-y divide-kxBorder">
                            <tr><td colspan="5" class="p-8 text-center text-zinc-500"><i class="fa-solid fa-circle-notch fa-spin text-kxAccent1 text-2xl mb-3 block"></i> A carregar base de dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminPass = "";

        // --- SISTEMA DE FORMATO DA KEY ---
        function setKeyFormat(format) {
            document.getElementById('global-key-format').value = format;
            
            const btnsTradicional = document.querySelectorAll('.fmt-tradicional-btn');
            const btnsZkXit = document.querySelectorAll('.fmt-zkxit-btn');

            if (format === 'tradicional') {
                btnsTradicional.forEach(btn => btn.className = "fmt-tradicional-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all");
                btnsZkXit.forEach(btn => btn.className = "fmt-zkxit-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all");
            } else {
                btnsTradicional.forEach(btn => btn.className = "fmt-tradicional-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all");
                btnsZkXit.forEach(btn => btn.className = "fmt-zkxit-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all");
            }
        }

        // --- FUNÇÃO DA BARRA DE DIAS RÁPIDA ---
        function selectDay(days) {
            document.getElementById('gen-days').value = days;
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach(btn => {
                btn.className = "day-btn py-2.5 rounded-xl border border-kxBorder bg-black/20 text-zinc-400 text-xs font-semibold hover:border-zinc-500 transition-all";
            });
            const activeBtn = document.getElementById(`btn-day-${days}`);
            if (activeBtn) {
                activeBtn.className = "day-btn py-2.5 rounded-xl border border-kxAccent1 bg-kxAccent1/10 text-kxAccent1 text-xs font-semibold shadow-[0_0_15px_rgba(115,100,255,0.2)] transition-all";
            }
        }

        // --- SISTEMA DE TOAST ---
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMsg = document.getElementById('toast-msg');
            
            toastMsg.innerText = msg;
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full shadow-2xl transition-all duration-300 z-50 flex items-center gap-3 backdrop-blur-md border transform`;
            
            if (type === 'error') {
                toast.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-400');
                toastIcon.className = 'fa-solid fa-circle-exclamation';
            } else if (type === 'info') {
                toast.classList.add('bg-blue-500/10', 'border-blue-500/20', 'text-blue-400');
                toastIcon.className = 'fa-solid fa-circle-info';
            } else {
                toast.classList.add('bg-green-500/10', 'border-green-500/20', 'text-green-400');
                toastIcon.className = 'fa-solid fa-circle-check';
            }
            
            toast.classList.remove('translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { 
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-12', 'opacity-0');
            }, 3500);
        }

        // --- API FETCHER ---
        async function apiRequest(endpoint, body) {
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                return await res.json();
            } catch (err) {
                return { success: false, error: "Erro de conexão com o servidor." };
            }
        }

        // --- LOGIN ---
        async function doLogin() {
            const passInput = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errTxt = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;
            errTxt.classList.add('hidden');

            const data = await apiRequest('/list', { password: passInput });
            
            btn.innerHTML = '<span>Autenticar</span><i class="fa-solid fa-arrow-right text-sm"></i>';
            btn.disabled = false;

            if (data && data.success) {
                adminPass = passInput;
                document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    document.getElementById('app').classList.add('flex');
                    showToast("Login efetuado com sucesso!", "success");
                }, 300);
            } else {
                errTxt.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ${data.error || "Acesso Negado."}`;
                errTxt.classList.remove('hidden');
                document.getElementById('password').value = "";
                document.getElementById('password').focus();
            }
        }

        function logout() {
            adminPass = "";
            document.getElementById('password').value = "";
            document.getElementById('app').classList.add('hidden');
            document.getElementById('app').classList.remove('flex');
            document.getElementById('login-screen').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            showToast("Sessão terminada.", "info");
        }

        // --- TABS ---
        function switchTab(tab) {
            const tabs = ['gerar', 'custom', 'gerir'];
            
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`view-${t}`).classList.remove('flex');
            });

            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`view-${tab}`).classList.remove('hidden');

            if (tab === 'gerir') {
                document.getElementById(`view-${tab}`).classList.add('flex');
                loadKeys();
            }
        }

        // --- QTY CONTROLS ---
        function changeQty(inputId, amount) {
            const input = document.getElementById(inputId);
            let val = parseInt(input.value) || 1;
            val += amount;
            if (val < 1) val = 1;
            if (val > 100) val = 100;
            input.value = val;
        }

        // --- GERAR KEYS ---
        async function generateKeys(type) {
            let totalDays = 0;
            let qty = 1;
            let btnId = '';
            let outId = '';
            
            const formatChoice = document.getElementById('global-key-format').value;

            if (type === 'rapido') {
                totalDays = parseFloat(document.getElementById('gen-days').value) || 7;
                qty = parseInt(document.getElementById('gen-qty').value) || 1;
                btnId = 'btn-generate-rapido';
                outId = 'gen-output';
            } else if (type === 'custom') {
                const d = parseInt(document.getElementById('custom-dias').value) || 0;
                const h = parseInt(document.getElementById('custom-horas').value) || 0;
                const m = parseInt(document.getElementById('custom-minutos').value) || 0;
                
                totalDays = d + (h / 24) + (m / 1440);
                qty = parseInt(document.getElementById('custom-qty').value) || 1;
                btnId = 'btn-generate-custom';
                outId = 'custom-output';

                if (totalDays <= 0) {
                    showToast("O tempo total deve ser maior que zero!", "error");
                    return;
                }
            }

            const btn = document.getElementById(btnId);
            const out = document.getElementById(outId);

            const textoOriginalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> A Processar...';
            btn.disabled = true;

            // Envia o pedido normal sem alterar o backend
            const data = await apiRequest('/generate', { 
                password: adminPass, 
                days: totalDays, 
                quantity: qty
            });

            btn.innerHTML = textoOriginalBtn;
            btn.disabled = false;

            if (data.success) {
                let finalKeys = data.keys;

                // TRUQUE NO HTML: O próprio gerador cola "ZkXit|3.0 - " na frente!
                if (formatChoice === 'zkxit') {
                    finalKeys = data.keys.map(k => "ZkXit|3.0 - " + k);
                }

                out.value = finalKeys.join('\n');
                showToast(`${data.keys.length} Key(s) gerada(s) com sucesso!`, "success");
            } else {
                showToast(data.error || "Erro ao gerar keys.", "error");
            }
        }

        function copyKeys(outId) {
            const out = document.getElementById(outId);
            if (!out.value) {
                showToast("Não há keys para copiar.", "info");
                return;
            }
            out.select();
            document.execCommand('copy');
            showToast("Keys copiadas para a área de transferência!", "success");
        }

        // --- FORMATAR DIAS ---
        function formatFractionalDays(fractionalDays) {
            if (fractionalDays >= 999) return "Vitalício";
            const totalMins = Math.round(fractionalDays * 24 * 60);
            const d = Math.floor(totalMins / 1440);
            const h = Math.floor((totalMins % 1440) / 60);
            const m = totalMins % 60;
            
            let res = [];
            if (d > 0) res.push(`${d}d`);
            if (h > 0) res.push(`${h}h`);
            if (m > 0 || res.length === 0) res.push(`${m}m`);
            return res.join(' ');
        }

        // --- GERIR KEYS ---
        async function loadKeys() {
            const tbody = document.getElementById('keys-tbody');
            const btn = document.getElementById('btn-refresh');
            const countLbl = document.getElementById('key-count');

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Atualizar';
            tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-zinc-500"><i class="fa-solid fa-circle-notch fa-spin text-kxAccent1 text-2xl mb-3 block"></i> Sincronizando...</td></tr>';

            const data = await apiRequest('/list', { password: adminPass });
            btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> Atualizar';

            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation text-xl block mb-2"></i> Erro: ${data.error}</td></tr>`;
                return;
            }

            countLbl.innerText = data.total;

            if (data.keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-zinc-500"><i class="fa-solid fa-database text-2xl mb-3 block opacity-50"></i> Banco de dados vazio.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            const sortedKeys = data.keys.reverse();

            sortedKeys.forEach(k => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/[0.02] transition border-b border-kxBorder last:border-0";
                
                let statusBadge = '';
                if(k.status === 'ativa') {
                    statusBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-green-500/10 text-green-400 rounded-lg text-[11px] font-bold tracking-wide border border-green-500/20"><span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> ATIVA</span>';
                } else if(k.status === 'expirada') {
                    statusBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-red-500/10 text-red-400 rounded-lg text-[11px] font-bold tracking-wide border border-red-500/20"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> EXPIRADA</span>';
                } else {
                    statusBadge = '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-yellow-500/10 text-yellow-400 rounded-lg text-[11px] font-bold tracking-wide border border-yellow-500/20"><span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span> AGUARDANDO</span>';
                }

                const dataExpiracao = k.expiresAt ? k.expiresAt : '<span class="text-zinc-600">Não ativada</span>';
                const userText = (k.userId && k.userId !== "-") ? k.userId : '<span class="text-zinc-600">Nenhum</span>';
                
                const tempoBonito = formatFractionalDays(k.days);

                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono text-zinc-300 font-medium tracking-wide">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-key text-zinc-600 text-xs"></i>
                            ${k.key}
                        </div>
                    </td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4">
                        <div class="text-zinc-300">${tempoBonito}</div>
                        <div class="text-xs text-zinc-500 mt-0.5">${dataExpiracao}</div>
                    </td>
                    <td class="px-6 py-4 font-mono text-xs text-zinc-400">${userText}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteKey('${k.key}')" class="text-zinc-500 hover:text-red-400 bg-white/5 hover:bg-red-500/10 border border-transparent hover:border-red-500/20 w-8 h-8 rounded-lg transition flex items-center justify-center ml-auto" title="Apagar Key">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteKey(keyStr) {
            if (!confirm(`TEM A CERTEZA?\n\nA key ${keyStr} será permanentemente apagada do banco de dados.`)) return;

            const data = await apiRequest('/delete', { password: adminPass, key: keyStr });
            if (data.success) {
                showToast(`Key ${keyStr} apagada com sucesso.`, "success");
                loadKeys();
            } else {
                showToast(data.error || "Erro ao apagar key.", "error");
            }
        }
    </script>
</body>
</html>
