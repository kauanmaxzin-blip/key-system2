<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KX Admin">
<meta name="theme-color" content="#0a0a0f">
<title>Kauan Xit · Admin</title>
<link rel="manifest" href="#" id="manifest-link">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg:       #0a0a0f;
    --bg2:      #111118;
    --bg3:      #1a1a24;
    --accent:   #7c6fff;
    --accent2:  #ff4d6d;
    --green:    #00e5a0;
    --text:     #e8e8f0;
    --muted:    #666680;
    --border:   #222230;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BG ── */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(124,111,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,111,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
    z-index:0;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    flex-direction:column; gap:0;
  }

  .login-card {
    width: min(380px, 92vw);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content:'';
    position:absolute;
    top:-60px; left:50%; transform:translateX(-50%);
    width:200px; height:200px;
    background: radial-gradient(circle, rgba(124,111,255,.15) 0%, transparent 70%);
    pointer-events:none;
  }

  .login-logo {
    text-align:center;
    margin-bottom:28px;
  }

  .login-logo .icon {
    font-size:2.8rem;
    display:block;
    margin-bottom:8px;
    filter: drop-shadow(0 0 20px rgba(124,111,255,.6));
  }

  .login-logo h1 {
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .login-logo p {
    font-size:.75rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-top:4px;
  }

  .input-group {
    position:relative;
    margin-bottom:16px;
  }

  .input-group input {
    width:100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius:10px;
    padding: 14px 16px;
    color: var(--text);
    font-family:'Space Mono', monospace;
    font-size:.9rem;
    outline:none;
    transition: border .2s;
    letter-spacing:.1em;
  }

  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color:var(--muted); letter-spacing:.05em; }

  .btn-login {
    width:100%;
    padding:14px;
    background: linear-gradient(135deg, var(--accent), #5a4fff);
    border:none;
    border-radius:10px;
    color:#fff;
    font-family:'Syne', sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition: opacity .2s, transform .1s;
    letter-spacing:.03em;
  }

  .btn-login:active { transform:scale(.98); opacity:.85; }

  .login-error {
    text-align:center;
    color:var(--accent2);
    font-size:.78rem;
    font-family:'Space Mono',monospace;
    margin-top:10px;
    height:16px;
  }

  /* ── MAIN APP ── */
  #app { display:none; position:relative; z-index:1; min-height:100vh; }

  /* ── HEADER ── */
  .header {
    background: rgba(10,10,15,.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:50;
  }

  .header-logo {
    display:flex; align-items:center; gap:10px;
  }

  .header-logo span { font-size:1.4rem; }

  .header-logo h2 {
    font-size:1rem; font-weight:800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .header-logo p {
    font-size:.62rem;
    color:var(--muted);
    font-family:'Space Mono',monospace;
  }

  .btn-logout {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius:8px;
    padding:7px 14px;
    color:var(--accent2);
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:.75rem;
    cursor:pointer;
  }

  /* ── TABS ── */
  .tabs {
    display:flex;
    background:var(--bg2);
    border-bottom:1px solid var(--border);
    padding:0 20px;
    gap:4px;
  }

  .tab {
    padding:12px 18px;
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:all .2s;
    white-space:nowrap;
  }

  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* ── CONTENT ── */
  .content { padding:20px; max-width:600px; margin:0 auto; }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── CARD ── */
  .card {
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }

  .card-title {
    font-size:.72rem;
    font-family:'Space Mono',monospace;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:14px;
  }

  /* ── PILLS DIAS ── */
  .pills {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:0;
  }

  .pill {
    padding:10px 8px;
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:.78rem;
    text-align:center;
    cursor:pointer;
    transition:all .2s;
    font-weight:700;
  }

  .pill.selected {
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    box-shadow:0 0 16px rgba(124,111,255,.35);
  }

  /* ── INPUTS ── */
  .field { margin-bottom:14px; }

  .field label {
    display:block;
    font-size:.7rem;
    font-family:'Space Mono',monospace;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .field input {
    width:100%;
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:.9rem;
    outline:none;
    transition:border .2s;
  }

  .field input:focus { border-color:var(--accent); }

  /* ── BOTÕES ── */
  .btn {
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:all .2s;
  }

  .btn:active { transform:scale(.98); opacity:.85; }

  .btn-primary {
    background:linear-gradient(135deg, var(--accent), #5a4fff);
    color:#fff;
    box-shadow:0 4px 20px rgba(124,111,255,.3);
  }

  .btn-danger {
    background:linear-gradient(135deg, var(--accent2), #c2003e);
    color:#fff;
    font-size:.85rem;
    padding:10px;
  }

  /* ── OUTPUT KEYS ── */
  .keys-output {
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    font-family:'Space Mono',monospace;
    font-size:.95rem;
    color:var(--accent);
    min-height:50px;
    word-break:break-all;
    line-height:2;
    white-space:pre-wrap;
    letter-spacing:.06em;
    margin-bottom:10px;
  }

  .copy-row {
    display:flex; gap:8px; align-items:center;
  }

  .btn-copy {
    flex:1;
    padding:10px;
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--green);
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    cursor:pointer;
    font-weight:700;
    transition:all .2s;
  }

  .btn-copy:active { opacity:.7; }

  .notif {
    font-size:.75rem;
    font-family:'Space Mono',monospace;
    height:18px;
    margin-top:6px;
    transition:opacity .3s;
  }

  .notif.ok  { color:var(--green); }
  .notif.err { color:var(--accent2); }

  /* ── LISTA DE KEYS ── */
  .key-item {
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    animation: fadeIn .3s ease;
  }

  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .key-item-code {
    flex:1;
    font-family:'Space Mono',monospace;
    font-size:1rem;
    color:var(--accent);
    letter-spacing:.1em;
    font-weight:700;
  }

  .key-item-info {
    font-size:.65rem;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    margin-top:3px;
  }

  .badge {
    display:inline-block;
    border-radius:20px;
    padding:3px 10px;
    font-size:.65rem;
    font-weight:700;
    font-family:'Space Mono',monospace;
    white-space:nowrap;
  }

  .badge-active   { background:rgba(0,229,160,.12); color:var(--green); border:1px solid rgba(0,229,160,.3); }
  .badge-wait     { background:rgba(255,200,0,.1);  color:#ffc800;      border:1px solid rgba(255,200,0,.25); }
  .badge-expired  { background:rgba(255,77,109,.1); color:var(--accent2); border:1px solid rgba(255,77,109,.25); }

  .btn-del {
    background:rgba(255,77,109,.1);
    border:1px solid rgba(255,77,109,.2);
    border-radius:8px;
    padding:7px 12px;
    color:var(--accent2);
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    cursor:pointer;
    font-weight:700;
    transition:all .2s;
    white-space:nowrap;
  }

  .btn-del:active { opacity:.7; }

  /* ── DELETE TAB ── */
  .delete-warning {
    background:rgba(255,77,109,.08);
    border:1px solid rgba(255,77,109,.2);
    border-radius:12px;
    padding:14px;
    font-size:.78rem;
    color:var(--accent2);
    font-family:'Space Mono',monospace;
    margin-bottom:16px;
    line-height:1.6;
  }

  /* ── LOADER ── */
  .loader {
    display:none;
    text-align:center;
    padding:30px;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:.8rem;
  }

  .loader.active { display:block; }

  .spinner {
    display:inline-block;
    width:24px; height:24px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-bottom:10px;
  }

  @keyframes spin { to{transform:rotate(360deg)} }

  .empty-state {
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    line-height:2;
  }

  /* ── STATS ── */
  .stats-row {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:16px;
  }

  .stat-card {
    background:var(--bg3);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
  }

  .stat-val {
    font-size:1.6rem;
    font-weight:800;
    font-family:'Space Mono',monospace;
    color:var(--accent);
    line-height:1;
  }

  .stat-label {
    font-size:.6rem;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-top:4px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<!-- ═══════════════════ LOGIN ═══════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">⚡</span>
      <h1>KAUAN XIT</h1>
      <p>// KEY ADMIN PANEL</p>
    </div>
    <div class="input-group">
      <input type="password" id="login-url" placeholder="URL do servidor" autocomplete="off">
    </div>
    <div class="input-group">
      <input type="password" id="login-pass" placeholder="Senha admin" autocomplete="off">
    </div>
    <button class="btn-login" onclick="doLogin()">ENTRAR</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════════════ APP ═══════════════════ -->
<div id="app">
  <div class="header">
    <div class="header-logo">
      <span>⚡</span>
      <div>
        <h2>KAUAN XIT</h2>
        <p>// KEY ADMIN</p>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">SAIR</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('gerar',this)">🔑 Gerar</button>
    <button class="tab" onclick="switchTab('lista',this)">📋 Keys</button>
    <button class="tab" onclick="switchTab('deletar',this)">🗑 Deletar</button>
  </div>

  <!-- TAB: GERAR -->
  <div class="content">
    <div id="tab-gerar" class="tab-panel active">
      <div class="card">
        <div class="card-title">⏱ Validade</div>
        <div class="pills">
          <div class="pill" onclick="selectDays(1,this)">1 dia</div>
          <div class="pill" onclick="selectDays(3,this)">3 dias</div>
          <div class="pill selected" onclick="selectDays(7,this)">7 dias</div>
          <div class="pill" onclick="selectDays(15,this)">15 dias</div>
          <div class="pill" onclick="selectDays(30,this)">30 dias</div>
          <div class="pill" onclick="selectDays(999,this)">∞ 999d</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"># Quantidade</div>
        <div class="field">
          <input type="number" id="qty" value="1" min="1" max="100" placeholder="1">
        </div>
      </div>

      <button class="btn btn-primary" onclick="gerarKey()" id="btn-gerar">🔑 &nbsp;GERAR KEY</button>

      <div class="card" style="margin-top:16px;" id="output-card">
        <div class="card-title">✅ Keys Geradas</div>
        <div class="keys-output" id="keys-output">Aguardando geração...</div>
        <div class="copy-row">
          <button class="btn-copy" onclick="copiarKeys()">📋 Copiar</button>
        </div>
        <div class="notif" id="notif-gerar"></div>
      </div>
    </div>

    <!-- TAB: LISTA -->
    <div id="tab-lista" class="tab-panel">
      <div class="stats-row" id="stats-row">
        <div class="stat-card"><div class="stat-val" id="stat-total">-</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-ativas">-</div><div class="stat-label">Ativas</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-aguardando">-</div><div class="stat-label">Livres</div></div>
      </div>

      <button class="btn btn-primary" style="margin-bottom:16px;" onclick="carregarLista()">🔄 &nbsp;Atualizar Lista</button>

      <div class="loader" id="loader-lista">
        <div class="spinner"></div><br>Carregando keys...
      </div>
      <div id="lista-keys"></div>
    </div>

    <!-- TAB: DELETAR -->
    <div id="tab-deletar" class="tab-panel">
      <div class="delete-warning">
        ⚠ Deletar uma key é permanente.<br>
        A pessoa perderá acesso imediatamente.
      </div>
      <div class="card">
        <div class="card-title">🗑 Deletar Key</div>
        <div class="field">
          <label>Código da Key</label>
          <input type="text" id="del-key" placeholder="EX: 7B4-8P9-8HP" style="text-transform:uppercase">
        </div>
        <button class="btn btn-danger" onclick="deletarKey()">DELETAR KEY</button>
        <div class="notif" id="notif-del" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
let SERVER_URL = "";
let ADMIN_PASS = "";
let selectedDays = 7;

// ── LOGIN ─────────────────────────────────────────────────────
async function doLogin() {
  const url  = document.getElementById("login-url").value.trim().replace(/\/$/, "");
  const pass = document.getElementById("login-pass").value.trim();
  const err  = document.getElementById("login-error");

  if (!url || !pass) { err.textContent = "Preencha todos os campos!"; return; }

  err.textContent = "Verificando...";

  try {
    const r = await fetch(url + "/list", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: pass})
    });
    const data = await r.json();
    if (data.success !== undefined) {
      SERVER_URL = url;
      ADMIN_PASS = pass;
      localStorage.setItem("kx_url", url);
      localStorage.setItem("kx_pass", pass);
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      err.textContent = "";
    } else {
      err.textContent = data.error || "Senha incorreta!";
    }
  } catch(e) {
    err.textContent = "Erro: verifique a URL do servidor.";
  }
}

function logout() {
  localStorage.removeItem("kx_url");
  localStorage.removeItem("kx_pass");
  location.reload();
}

// Auto-login se salvou credenciais
window.onload = () => {
  const url  = localStorage.getItem("kx_url");
  const pass = localStorage.getItem("kx_pass");
  if (url && pass) {
    document.getElementById("login-url").value  = url;
    document.getElementById("login-pass").value = pass;
  }

  // Enter no login
  document.getElementById("login-pass").addEventListener("keydown", e => {
    if(e.key === "Enter") doLogin();
  });
};

// ── TABS ──────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "lista") carregarLista();
}

// ── DIAS ──────────────────────────────────────────────────────
function selectDays(d, el) {
  selectedDays = d;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("selected"));
  el.classList.add("selected");
}

// ── GERAR KEY ─────────────────────────────────────────────────
async function gerarKey() {
  const qty = parseInt(document.getElementById("qty").value) || 1;
  const btn = document.getElementById("btn-gerar");
  const out = document.getElementById("keys-output");
  const notif = document.getElementById("notif-gerar");

  btn.textContent = "⏳  Gerando...";
  btn.disabled = true;
  notif.textContent = "";

  try {
    const r = await fetch(SERVER_URL + "/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password:ADMIN_PASS, days:selectedDays, quantity:qty})
    });
    const data = await r.json();

    if (data.success) {
      out.textContent = data.keys.join("\n");
      out.style.color = "var(--accent)";
      notif.textContent = `✔ ${data.keys.length} key(s) gerada(s)!`;
      notif.className = "notif ok";
    } else {
      out.textContent = "❌ " + (data.error || "Erro desconhecido");
      out.style.color = "var(--accent2)";
      notif.textContent = "Verifique a conexão.";
      notif.className = "notif err";
    }
  } catch(e) {
    out.textContent = "❌ Sem conexão com o servidor!";
    out.style.color = "var(--accent2)";
  }

  btn.textContent = "🔑  GERAR KEY";
  btn.disabled = false;
}

// ── COPIAR ────────────────────────────────────────────────────
function copiarKeys() {
  const txt = document.getElementById("keys-output").textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const n = document.getElementById("notif-gerar");
    n.textContent = "✔ Copiado!";
    n.className = "notif ok";
  });
}

// ── LISTAR KEYS ───────────────────────────────────────────────
async function carregarLista() {
  const loader = document.getElementById("loader-lista");
  const lista  = document.getElementById("lista-keys");
  loader.classList.add("active");
  lista.innerHTML = "";

  try {
    const r = await fetch(SERVER_URL + "/list", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password:ADMIN_PASS})
    });
    const data = await r.json();
    loader.classList.remove("active");

    if (!data.success) { lista.innerHTML = `<div class="empty-state">Erro ao carregar.</div>`; return; }

    // Stats
    const total     = data.keys.length;
    const ativas    = data.keys.filter(k => k.status === "ativa").length;
    const aguardando = data.keys.filter(k => k.status === "aguardando").length;
    document.getElementById("stat-total").textContent     = total;
    document.getElementById("stat-ativas").textContent    = ativas;
    document.getElementById("stat-aguardando").textContent = aguardando;

    if (total === 0) {
      lista.innerHTML = `<div class="empty-state">Nenhuma key gerada ainda.<br>Vá em 🔑 Gerar para criar!</div>`;
      return;
    }

    // Ordena: aguardando → ativa → expirada
    const ordem = {aguardando:0, ativa:1, expirada:2};
    data.keys.sort((a,b) => (ordem[a.status]||0) - (ordem[b.status]||0));

    data.keys.forEach(k => {
      const badgeClass = k.status === "ativa" ? "badge-active" : k.status === "aguardando" ? "badge-wait" : "badge-expired";
      const badgeTxt   = k.status === "ativa" ? "ATIVA" : k.status === "aguardando" ? "LIVRE" : "EXPIRADA";
      const info = k.status === "aguardando"
        ? `${k.days} dia(s) · ainda não usada`
        : k.expiresAt ? `Expira: ${k.expiresAt}` : "";
      const userId = k.userId !== "-" ? `<div class="key-item-info">👤 ${k.userId}</div>` : "";

      const el = document.createElement("div");
      el.className = "key-item";
      el.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div class="key-item-code">${k.key}</div>
          <div class="key-item-info">${info}</div>
          ${userId}
        </div>
        <span class="badge ${badgeClass}">${badgeTxt}</span>
        <button class="btn-del" onclick="deletarKeyDireto('${k.key}', this)">DEL</button>
      `;
      lista.appendChild(el);
    });

  } catch(e) {
    loader.classList.remove("active");
    lista.innerHTML = `<div class="empty-state">Erro de conexão.</div>`;
  }
}

// ── DELETAR DA LISTA ──────────────────────────────────────────
async function deletarKeyDireto(key, btn) {
  if (!confirm(`Deletar a key ${key}?`)) return;
  btn.textContent = "...";
  btn.disabled = true;
  try {
    const r = await fetch(SERVER_URL + "/delete", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password:ADMIN_PASS, key})
    });
    const data = await r.json();
    if (data.success) {
      btn.closest(".key-item").remove();
    } else {
      btn.textContent = "ERR";
    }
  } catch { btn.textContent = "ERR"; }
}

// ── DELETAR MANUAL ────────────────────────────────────────────
async function deletarKey() {
  const key   = document.getElementById("del-key").value.trim().toUpperCase();
  const notif = document.getElementById("notif-del");
  if (!key) { notif.textContent = "Digite o código!"; notif.className="notif err"; return; }

  notif.textContent = "Deletando...";
  try {
    const r = await fetch(SERVER_URL + "/delete", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password:ADMIN_PASS, key})
    });
    const data = await r.json();
    if (data.success) {
      notif.textContent = `✔ Key ${key} deletada!`;
      notif.className = "notif ok";
      document.getElementById("del-key").value = "";
    } else {
      notif.textContent = "❌ " + (data.error || "Erro");
      notif.className = "notif err";
    }
  } catch {
    notif.textContent = "❌ Sem conexão!";
    notif.className = "notif err";
  }
}

// ── Enter nas inputs ──────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (document.activeElement.id === "del-key") deletarKey();
  }
});
</script>
